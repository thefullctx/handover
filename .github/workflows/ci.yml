name: CI

# The release gate for Handover: fmt, clippy, the full Rust test suite, the UI
# lint/typecheck/tests, and the end-to-end smoke test. This mirrors
# scripts/verify.sh, which remains the single local entry point — if you add a
# step there, add it here too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the suite hermetic: the prompt temp-cache dir must never land in the
  # runner's real cache (see CONTRIBUTING.md).
  HANDOVER_PROMPT_CACHE_DIR: ${{ github.workspace }}/.ci-prompt-cache

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desktop app is macOS/Linux only (tray, hotkey, pgrep, tty
        # approval); the libraries and daemon build anywhere.
        #
        # Pinned to the explicit Ubuntu version rather than `ubuntu-latest`:
        # the `latest` label migrates 24.04 -> 26.04 between 2026-10-19 and
        # 2026-11-19, which would move the runner image under us. Naming the
        # version means the OS only changes when this line changes — and the
        # Tauri system packages below are the thing most likely to break when
        # it does.
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the version; rustup fetches it automatically.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The workspace includes the Tauri desktop crate, so the Linux runner
      # needs Tauri's system dependencies before clippy/tests can even
      # compile it (glib-sys and friends are built from source otherwise).
      # Same list as the Linux prerequisites in README/CONTRIBUTING.
      - name: install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: cargo fmt --check
        run: cargo fmt --check

      # Warning-free across the workspace, including test targets.
      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  ui:
    name: UI (lint, typecheck, tests, build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      # `npm ci`, not `npm install`: the lockfile is committed, so CI installs
      # exactly the reviewed dependency tree and fails loudly if package.json
      # and the lockfile ever disagree.
      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npx vitest run

      # tsc + vite: the bundle the Tauri app ships.
      - name: build
        run: npm run build

      # Advisory visibility for what actually ships. `--omit=dev` scopes it to
      # production dependencies. Non-blocking on purpose: this reports, it does
      # not gate (see CONTRIBUTING "Dependency advisories").
      - name: audit (production deps, non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # daemon -> local HTTP API -> CLI -> demo agent, end to end, against a
      # throwaway HOME.
      - name: smoke test
        run: ./scripts/smoke-test.sh