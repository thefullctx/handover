name: DIAG (temporary)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diag:
    runs-on: ubuntu-26.04
    steps:
      - name: probe viability
        run: |
          set +e
          N="ho-probe-550e8400e29b41d4a716446655440000"
          P="/tmp/$N"

          cp /bin/sleep "$P.a" 2>&1
          "$P.a" 30 &
          A=$!
          sleep 1
          if kill -0 $A 2>/dev/null; then echo "A copied-sleep: ALIVE"; else echo "A copied-sleep: DEAD"; fi
          kill $A 2>/dev/null
          wait $A 2>/dev/null

          printf '#!/bin/sh\nsleep 30\n' > "$P.b"
          chmod +x "$P.b"
          "$P.b" &
          B=$!
          sleep 1
          if kill -0 $B 2>/dev/null; then echo "B shebang-script: ALIVE"; else echo "B shebang-script: DEAD"; fi
          echo "B comm: $(cat /proc/$B/comm 2>/dev/null)"
          echo "B ps: $(ps -axo command= | grep -F "$N.b" | head -1)"
          if ps -axo command= | grep -F "$N.b" | head -1 | tr -s ' /' '\n\n\n' | grep -qx "$N.b"; then
            echo "B COMPONENT: OK"
          else
            echo "B COMPONENT: FAILED"
          fi
          if pgrep -x "$N.b" >/dev/null 2>&1; then echo "B pgrep -x: match"; else echo "B pgrep -x: no"; fi
          kill $B 2>/dev/null
          wait $B 2>/dev/null

          echo "E /bin/sleep -> $(readlink -f /bin/sleep)"
          echo "E /bin/sh -> $(readlink -f /bin/sh)"
          rm -f "$P".a "$P".b "$P".c
          echo DONE