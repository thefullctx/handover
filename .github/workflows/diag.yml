name: DIAG (temporary)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diag:
    runs-on: ubuntu-26.04
    steps:
      - name: Find a portable probe
        run: |
          NAME="ho-probe-550e8400e29b41d4a716446655440000"
          P="/tmp/$NAME"

          echo "=== A: copied /bin/sleep (current approach) ==="
          cp /bin/sleep "$P.a"; "$P.a" 30 & A=$!; sleep 0.5
          echo "alive: $(kill -0 $A 2>/dev/null && echo yes || echo NO)"; kill $A 2>/dev/null

          echo "=== B: shebang script with the long name ==="
          printf '#!/bin/sh\nsleep 30\n' > "$P.b"; chmod +x "$P.b"
          "$P.b" & B=$!; sleep 0.5
          echo "alive: $(kill -0 $B 2>/dev/null && echo yes || echo NO)"
          echo "comm: $(cat /proc/$B/comm 2>/dev/null)"
          echo "ps line: $(ps -axo command= | grep -F "$NAME.b" | head -1)"
          echo "pgrep -x full: $(pgrep -x "$NAME.b" >/dev/null 2>&1 && echo match || echo no)"
          echo "ps component split test:"
          ps -axo command= | grep -F "$NAME.b" | head -1 | tr -s ' /' '\n\n\n' | grep -Fx "$NAME.b" && echo "  COMPONENT MATCH OK" || echo "  COMPONENT MATCH FAILED"
          kill $B 2>/dev/null

          echo "=== C: symlink to /bin/sleep ==="
          ln -s /bin/sleep "$P.c"; "$P.c" 30 & C=$!; sleep 0.5
          echo "alive: $(kill -0 $C 2>/dev/null && echo yes || echo NO)"; kill $C 2>/dev/null

          echo "=== D: does the interpreter path survive argv0 rename? ==="
          echo "=== E: what is /bin/sleep actually? ==="
          file /bin/sleep 2>/dev/null || ls -l /bin/sleep
          ls -l /bin/sh
          rm -f "$P".?