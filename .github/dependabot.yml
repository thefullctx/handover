# Without this, SHA-pinned actions silently stop receiving fixes: the pin
# freezes the code and there is no signal when upstream moves. Dependabot
# opens the PR that re-points each SHA, so pinning buys immutability without
# costing patches.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Cargo.lock is committed, so crate updates arrive as reviewable PRs
  # instead of drifting until someone runs `cargo update`.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
  # Only the Tauri JS packages: they must stay on the same major/minor as the
  # Rust `tauri` crate above (the Tauri CLI reports a mismatch otherwise), and
  # without this entry the cargo side moved on alone.
  - package-ecosystem: "npm"
    directory: "/apps/desktop/ui"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@tauri-apps/*"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
