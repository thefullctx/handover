[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/config",
  "crates/agents",
  "crates/daemon",
  "apps/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "7"
log = "0.4"
