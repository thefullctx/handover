<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b16" />
    <title>Handover</title>
    <script>
      // Provisional theme before React mounts (no flash): resolve the system
      // appearance now. main.tsx corrects it to the persisted preference
      // (System / Light / Dark) once the backend answers.
      document.documentElement.dataset.theme = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
