[package]
name = "handover-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Handover desktop app — tray + global hotkey + command palette"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = "1"
log.workspace = true
env_logger = "0.11"

handover-core = { path = "../../../crates/core" }
handover-config = { path = "../../../crates/config" }
handover-agents = { path = "../../../crates/agents" }
handover-daemon = { path = "../../../crates/daemon" }
