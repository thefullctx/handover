[package]
name = "handover-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Handover background daemon: local HTTP API, capture and handoff orchestration"

# Declares the `test-util` feature referenced by #[cfg(feature = "test-util")]
# gates (lets other crates compile in test doubles without a real filesystem).
[features]
test-util = []

[dependencies]
handover-core = { path = "../core" }
handover-config = { path = "../config" }
handover-agents = { path = "../agents" }
serde.workspace = true
serde_json = "1"
chrono.workspace = true
tiny_http = "0.12"
arboard = "3"
dirs.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
uuid.workspace = true
